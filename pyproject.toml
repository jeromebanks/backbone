[project]
name = "backbone"
version = "0.1.0"
description = "Auditable clinical abstraction prototype: evidence claims -> reconciled encounters -> typed query plans"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",   # only needed for BACKBONE_LLM=anthropic-api
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backbone"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
